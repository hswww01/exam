# Include inside the existing HTTPS server block. Application source stays outside the web root.
location = /exam { return 302 /exam/; }
location ^~ /exam/ { rewrite ^ /exam/index.php last; }
location = /exam/index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/yixue-exam/public/index.php;
    fastcgi_param SCRIPT_NAME /exam/index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_read_timeout 30s;
    client_max_body_size 2m;
}
